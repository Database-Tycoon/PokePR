name: 'PokéPR'
description: 'Encounter Pokémon when you open a PR. Catch them when you merge!'
author: 'pokepr'

branding:
  icon: 'zap'
  color: 'yellow'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  gist-id:
    description: 'ID of your Pokédex Gist (optional, for tracking caught/seen)'
    required: false
    default: ''
  gist-token:
    description: 'Personal access token with gist scope (optional, required if gist-id is set)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Run PokéPR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        GIST_ID: ${{ inputs.gist-id }}
        GIST_TOKEN: ${{ inputs.gist-token }}
      run: uv run --project ${{ github.action_path }} python -m pokepr
