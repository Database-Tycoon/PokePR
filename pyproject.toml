[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokepr"
version = "0.1.0"
description = "Encounter Pokémon when you open a PR. Catch them when you merge!"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["github", "pokemon", "pull-request", "developer-tools", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.28.0"]

[project.scripts]
pokepr = "pokepr.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pokepr"]
